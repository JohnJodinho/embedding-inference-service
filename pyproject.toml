[project]
name = "embedding-inference-service"
version = "1.0.0"
description = "Bounded CPU embedding inference API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.165.0",
    "sentence-transformers==6.3.0",
    "torch==2.15.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
test = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
