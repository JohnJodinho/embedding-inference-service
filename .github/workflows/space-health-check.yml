name: Keep Hugging Face Space warm

on:
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: space-health-check
  cancel-in-progress: false

jobs:
  health-check:
    name: Check Space liveness and readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wake Space and wait for readiness
        shell: bash
        run: |
          set -euo pipefail
          base_url="https://johnalbarkaibrahim-sentimentscope.hf.space"

          for attempt in $(seq 1 20); do
            live_status="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --connect-timeout 10 --max-time 15 \
              "$base_url/health/live" || true)"
            ready_status="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' --connect-timeout 10 --max-time 15 \
              "$base_url/health/ready" || true)"

            if [[ "$live_status" == "200" && "$ready_status" == "200" ]]; then
              echo "Space is live and ready."
              exit 0
            fi

            echo "Attempt $attempt/20: live=$live_status ready=$ready_status"
            if [[ "$attempt" -lt 20 ]]; then
              sleep 30
            fi
          done

          echo "::error::Space did not become live and ready within the check window."
          exit 1
