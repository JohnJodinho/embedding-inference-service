name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Sync GitHub main to HF Space
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitHub main
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Hugging Face remote
        run: git remote add hf https://huggingface.co/spaces/JohnAlbarkaIbrahim/SentimentScope.git

      # HF main is intentionally a deployment mirror: GitHub main replaces it
      # exactly, including its tree, so the two repositories are never merged.
      - name: Replace the HF deployment mirror
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          : "${HF_TOKEN:?HF_TOKEN secret is required}"
          AUTH_HEADER="$(printf 'x-access-token:%s' "$HF_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$AUTH_HEADER"
          git -c http.https://huggingface.co/.extraheader="AUTHORIZATION: Basic ${AUTH_HEADER}" \
            push --force hf HEAD:main
