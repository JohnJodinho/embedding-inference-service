name: Clear Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Clear HF Space contents
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"

      - name: Replace HF main with an empty tree
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          : "${HF_TOKEN:?HF_TOKEN secret is required}"
          HF_REMOTE="https://x-access-token:${HF_TOKEN}@huggingface.co/spaces/JohnAlbarkaIbrahim/SentimentScope.git"
          git remote add hf "$HF_REMOTE"
          EMPTY_TREE="$(git mktree </dev/null)"
          EMPTY_COMMIT="$(printf 'chore: clear Hugging Face Space\n' | git commit-tree "$EMPTY_TREE")"
          git push --force hf "$EMPTY_COMMIT:main"
