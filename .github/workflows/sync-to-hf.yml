name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync GitHub main to HF Space
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitHub source
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"

      - name: Push source to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -e
          HF_REMOTE="https://x-access-token:${HF_TOKEN}@huggingface.co/spaces/JohnAlbarkaIbrahim/SentimentScope.git"
          git remote add hf "$HF_REMOTE" 2>/dev/null || true
          git fetch hf main 2>/dev/null || true
          if git rev-parse --verify --quiet refs/remotes/hf/main; then
            # First-time alignment: the Space already has its own history.
            # GitHub main is the source of truth; on any conflict keep the
            # GitHub version (-X ours). After this alignment, later pushes
            # are normal fast-forwards and no force push is needed.
            git merge --allow-unrelated-histories -X ours \
              -m "build: align with existing Hugging Face Space history" \
              refs/remotes/hf/main
          fi
          git push hf HEAD:main
